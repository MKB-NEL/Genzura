<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GENZURA · Users Management</title>
  <link rel="icon" type="image/png" href="https://i.ibb.co/mFqfcpPj/cropped-circle-image.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Load the dedicated users.css -->
  <link rel="stylesheet" href="users.css">
</head>
<body>

  <div class="container">
    
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <a href="dashboard.html" class="back-btn" title="Back to Dashboard">
          <i class="fas fa-arrow-left"></i>
        </a>
        <div>
          <h1>Users Management</h1>
          <p>Grant or revoke premium access</p>
        </div>
      </div>
      <button class="back-btn" id="refreshBtn" title="Refresh Users">
        <i class="fas fa-rotate"></i>
      </button>
    </header>

    <!-- Stats Row -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Users</div>
        <div class="stat-value" id="statTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Premium Active</div>
        <div class="stat-value" id="statPremium" style="color: var(--success);">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Expired</div>
        <div class="stat-value" id="statExpired" style="color: var(--danger);">0</div>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
      <i class="fas fa-search"></i>
      <input type="search" id="searchInput" placeholder="Search by name, phone, or email...">
    </div>

    <!-- Loading State -->
    <div id="loadingState" style="text-align: center; padding: 40px;">
      <div class="spinner"></div>
      <p style="color: var(--muted); font-weight: 600;">Fetching users...</p>
    </div>

    <!-- User List Container -->
    <div id="userListContainer" style="display: none;">
      <div id="userList" class="user-list"></div>
      
      <div id="emptySearch" class="empty-state" style="display: none;">
        <i class="fas fa-search"></i>
        <p>No users found matching your search.</p>
      </div>
    </div>

  </div>

  <div id="toast" class="toast"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD-8JzL7GPhGhjzQCrAZOJWmyb-hPuaA0U",
      authDomain: "mypersonalai-22391.firebaseapp.com",
      databaseURL: "https://mypersonalai-22391-default-rtdb.firebaseio.com",
      projectId: "mypersonalai-22391",
      storageBucket: "mypersonalai-22391.firebasestorage.app",
      messagingSenderId: "527318613254",
      appId: "1:527318613254:web:be2ede267103601f187287"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  </script>

  <script>
    (function () {
      var auth = firebase.auth();
      var db = firebase.firestore();
      
      var els = {
        loading: document.getElementById('loadingState'),
        container: document.getElementById('userListContainer'),
        search: document.getElementById('searchInput'),
        list: document.getElementById('userList'),
        emptySearch: document.getElementById('emptySearch'),
        refreshBtn: document.getElementById('refreshBtn'),
        toast: document.getElementById('toast'),
        statTotal: document.getElementById('statTotal'),
        statPremium: document.getElementById('statPremium'),
        statExpired: document.getElementById('statExpired')
      };

      var usersData = [];

      // --- Toast Notifications ---
      function showToast(msg, type) {
        els.toast.textContent = msg;
        els.toast.className = 'toast show ' + (type || '');
        setTimeout(function() { els.toast.className = 'toast'; }, 3000);
      }

      // --- Auth Check (Bypassed) ---
      auth.onAuthStateChanged(function (user) {
        if (!user) { 
          window.location.replace('index.html'); 
          return; 
        }
        loadUsers();
      });

      // --- Fetch Users ---
      function loadUsers() {
        els.loading.style.display = 'block';
        els.container.style.display = 'none';
        
        db.collection('users').get().then(function(snapshot) {
          usersData = snapshot.docs.map(function(d) { 
            return Object.assign({ id: d.id }, d.data()); 
          });
          
          els.loading.style.display = 'none';
          els.container.style.display = 'block';
          calculateStats();
          renderUsers();
        }).catch(function(err) {
          showToast('Failed to load users: ' + err.message, 'error');
          els.loading.style.display = 'none';
        });
      }

      // --- Calculate Stats ---
      function calculateStats() {
        var total = usersData.length;
        var premium = 0;
        var expired = 0;

        usersData.forEach(function(u) {
          if (u.role === 'admin') {
            premium++; // Admins count as premium
            return;
          }
          var isPremium = false;
          if (u.premiumUntil) {
            var ms = u.premiumUntil.toMillis ? u.premiumUntil.toMillis() : u.premiumUntil.seconds * 1000;
            if (ms > Date.now()) isPremium = true;
          }
          
          if (isPremium) premium++;
          else expired++;
        });

        els.statTotal.textContent = total;
        els.statPremium.textContent = premium;
        els.statExpired.textContent = expired;
      }

      // --- Format Date ---
      function formatDate(ms) {
        var d = new Date(ms);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      }

      // --- Render Users ---
      function renderUsers() {
        var q = els.search.value.toLowerCase();
        var filtered = usersData.filter(function(u) {
          var str = (u.fullName || '') + ' ' + (u.phone || '') + ' ' + (u.email || '');
          return str.toLowerCase().includes(q);
        });

        if (filtered.length === 0) {
          els.list.innerHTML = '';
          els.emptySearch.style.display = 'block';
          return;
        }

        els.emptySearch.style.display = 'none';

        els.list.innerHTML = filtered.map(function(u) {
          var isAdmin = u.role === 'admin';
          var isPremium = false;
          var daysLeft = 0;
          var expiryDate = '';

          if (u.premiumUntil) {
            var ms = u.premiumUntil.toMillis ? u.premiumUntil.toMillis() : u.premiumUntil.seconds * 1000;
            if (ms > Date.now()) {
              isPremium = true;
              daysLeft = Math.ceil((ms - Date.now()) / (1000 * 60 * 60 * 24));
              expiryDate = formatDate(ms);
            }
          }

          // Badges
          var badgeHtml = '';
          if (isAdmin) {
            badgeHtml = '<span class="badge badge-admin"><i class="fas fa-shield-halved"></i> Admin</span>';
          } else if (isPremium) {
            badgeHtml = '<span class="badge badge-premium"><i class="fas fa-check-circle"></i> Premium (' + daysLeft + 'd left)</span>';
          } else {
            badgeHtml = '<span class="badge badge-expired"><i class="fas fa-times-circle"></i> Expired</span>';
          }

          if (expiryDate) {
            badgeHtml += '<span class="badge badge-date">Ends: ' + expiryDate + '</span>';
          }

          // Actions
          var actionsHtml = '';
          if (isAdmin) {
            actionsHtml = '<span style="font-size:13px; font-style:italic; color:var(--muted); width:100%; text-align:center;">Admins cannot be modified</span>';
          } else {
            actionsHtml = `
              <div class="input-group">
                <input type="number" id="input-${u.id}" placeholder="Days" min="1">
                <button onclick="applyDays('${u.id}')">APPLY</button>
              </div>
              ${isPremium ? `<button class="btn-revoke" onclick="revoke('${u.id}')" title="Remove Premium Access"><i class="fas fa-trash-alt"></i></button>` : ''}
            `;
          }

          return `
            <div class="user-card">
              <div class="user-info">
                <div class="user-name">${u.fullName || 'Unknown User'}</div>
                <div class="user-contact">
                  <i class="fas fa-phone"></i> ${u.phone || 'No phone'} 
                  ${u.email ? '· <i class="fas fa-envelope"></i> ' + u.email : ''}
                </div>
                <div class="badges">
                  ${badgeHtml}
                </div>
              </div>
              <div class="user-actions">
                ${actionsHtml}
              </div>
            </div>
          `;
        }).join('');
      }

      // --- Apply Custom Days ---
      window.applyDays = function(uid) {
        var input = document.getElementById('input-' + uid);
        var days = parseInt(input.value, 10);
        
        if (!days || days < 1) {
          showToast('Please enter a valid number of days.', 'error');
          input.focus();
          return;
        }

        var user = usersData.find(function(u) { return u.id === uid; });
        if (!user) return;

        // Calculate new date
        var now = new Date();
        var currentExpiry = (user.premiumUntil && user.premiumUntil.seconds) 
          ? new Date(user.premiumUntil.seconds * 1000) 
          : now;
          
        // Start from today if expired, or add to existing date if active
        var baseDate = currentExpiry > now ? currentExpiry : now;
        baseDate.setDate(baseDate.getDate() + days);

        // UI Loading state
        var btn = input.nextElementSibling;
        var originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = '...';

        db.collection('users').doc(uid).update({
          premiumUntil: firebase.firestore.Timestamp.fromDate(baseDate)
        }).then(function() {
          showToast(`Successfully added ${days} days to ${user.fullName || 'User'}.`, 'success');
          loadUsers(); // Refresh the entire list & stats
        }).catch(function(err) {
          showToast('Error: ' + err.message, 'error');
          btn.disabled = false;
          btn.textContent = originalText;
        });
      };

      // --- Revoke Premium ---
      window.revoke = function(uid) {
        var user = usersData.find(function(u) { return u.id === uid; });
        if (!user) return;

        if (!confirm(`Are you sure you want to remove premium access for ${user.fullName}?`)) {
          return;
        }

        db.collection('users').doc(uid).update({
          premiumUntil: null
        }).then(function() {
          showToast('Premium access revoked.', 'info');
          loadUsers();
        }).catch(function(err) {
          showToast('Error: ' + err.message, 'error');
        });
      };

      // --- Event Listeners ---
      els.search.addEventListener('input', renderUsers);
      els.refreshBtn.addEventListener('click', loadUsers);

    })();
  </script>
</body>
</html>
