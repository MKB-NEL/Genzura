<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GENZURA · Admin Panel</title>
  <link rel="icon" type="image/png" href="https://i.ibb.co/mFqfcpPj/cropped-circle-image.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Load Dashboard styles -->
  <link rel="stylesheet" href="dashboard/dashboard.css">
  
  <style>
    /* Admin Panel Custom Styles */
    .admin-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .search-wrapper {
      position: relative;
      margin-bottom: 24px;
    }
    .search-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 16px;
    }
    .search-wrapper input {
      width: 100%;
      padding: 16px 16px 16px 48px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      background: #fff;
    }
    .search-wrapper input:focus {
      border-color: var(--primary);
    }

    /* User List */
    .user-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .user-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .user-card {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    /* User Info */
    .user-info {
      flex: 1;
      min-width: 0;
    }
    .user-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text);
    }
    .user-contact {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* Badges */
    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid transparent;
    }
    .badge-admin { background: #eaf0f8; color: #1a5fb4; border-color: #c5d6ea; }
    .badge-premium { background: #ebf5ed; color: #2d7a3e; border-color: #c2dcc9; }
    .badge-expired { background: #fbeceb; color: #b3261e; border-color: #efc2bd; }
    .badge-date { background: #f8f9fa; color: #666; border-color: #ddd; }

    /* Actions Area */
    .user-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    @media (min-width: 768px) {
      .user-actions {
        border-top: none;
        border-left: 1px solid var(--border);
        padding-top: 0;
        padding-left: 24px;
        flex-direction: row;
        align-items: center;
        min-width: 320px;
      }
    }

    /* Input Group */
    .input-group {
      display: flex;
      width: 100%;
    }
    .input-group input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-right: none;
      border-radius: var(--radius-sm) 0 0 var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      outline: none;
    }
    .input-group input:focus {
      border-color: var(--primary);
    }
    .input-group button {
      padding: 12px 20px;
      background: var(--primary);
      color: #fff;
      border: 1px solid var(--primary);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s;
    }
    .input-group button:hover {
      background: var(--primary-hover);
    }

    .btn-revoke {
      padding: 12px 16px;
      background: #fff;
      color: var(--danger);
      border: 1px solid var(--danger);
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-revoke:hover {
      background: #fbeceb;
    }

    /* Misc */
    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }
    .empty-state i {
      font-size: 32px;
      margin-bottom: 12px;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    
    <!-- Header -->
    <header class="app-header" style="border-bottom: none; margin-bottom: 24px;">
      <div class="brand">
        <a href="dashboard.html" class="icon-btn" title="Back to dashboard">
          <i class="fas fa-arrow-left"></i>
        </a>
        <div class="brand-logo" style="background: #eaf0f8; color: #1a5fb4; border-color: #1a5fb4;">
          <i class="fas fa-shield-halved"></i>
        </div>
        <div class="brand-text">
          <h1>Admin Panel</h1>
          <p>Manage user access</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="refreshBtn" title="Refresh List">
          <i class="fas fa-rotate"></i>
        </button>
      </div>
    </header>

    <!-- Search Bar -->
    <div class="search-wrapper">
      <i class="fas fa-search"></i>
      <input type="search" id="adminSearch" placeholder="Search by name, phone or email...">
    </div>

    <!-- Loading State -->
    <div id="adminLoading" style="text-align:center; padding: 40px;">
      <div class="spinner" style="margin: 0 auto 12px;"></div>
      <p class="muted">Loading users...</p>
    </div>

    <!-- User List -->
    <div id="adminContent" style="display:none;">
      <div id="userList" class="user-list"></div>
      
      <div id="emptySearch" class="empty-state" style="display:none;">
        <i class="fas fa-search"></i>
        <p>No users found matching your search.</p>
      </div>
    </div>

  </div>

  <div id="toast" class="toast"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD-8JzL7GPhGhjzQCrAZOJWmyb-hPuaA0U",
      authDomain: "mypersonalai-22391.firebaseapp.com",
      databaseURL: "https://mypersonalai-22391-default-rtdb.firebaseio.com",
      projectId: "mypersonalai-22391",
      storageBucket: "mypersonalai-22391.firebasestorage.app",
      messagingSenderId: "527318613254",
      appId: "1:527318613254:web:be2ede267103601f187287"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  </script>

  <script>
    (function () {
      var auth = firebase.auth();
      var db = firebase.firestore();
      
      var els = {
        loading: document.getElementById('adminLoading'),
        content: document.getElementById('adminContent'),
        search: document.getElementById('adminSearch'),
        list: document.getElementById('userList'),
        emptySearch: document.getElementById('emptySearch'),
        refreshBtn: document.getElementById('refreshBtn'),
        toast: document.getElementById('toast')
      };

      var usersData = [];

      // --- Toast Notifications ---
      function showToast(msg, type) {
        els.toast.textContent = msg;
        els.toast.className = 'toast show ' + (type || '');
        setTimeout(function() { els.toast.className = 'toast'; }, 3000);
      }

      // --- Auth Check (Bypassed) ---
      auth.onAuthStateChanged(function (user) {
        if (!user) { 
          window.location.replace('index.html'); 
          return; 
        }
        loadUsers();
      });

      // --- Fetch Users ---
      function loadUsers() {
        els.loading.style.display = 'block';
        els.content.style.display = 'none';
        
        db.collection('users').get().then(function(snapshot) {
          usersData = snapshot.docs.map(function(d) { 
            return Object.assign({ id: d.id }, d.data()); 
          });
          
          els.loading.style.display = 'none';
          els.content.style.display = 'block';
          renderUsers();
        }).catch(function(err) {
          showToast('Failed to load users: ' + err.message, 'error');
          els.loading.style.display = 'none';
        });
      }

      // --- Format Date ---
      function formatDate(ms) {
        var d = new Date(ms);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      }

      // --- Render Users ---
      function renderUsers() {
        var q = els.search.value.toLowerCase();
        var filtered = usersData.filter(function(u) {
          var str = (u.fullName || '') + ' ' + (u.phone || '') + ' ' + (u.email || '');
          return str.toLowerCase().includes(q);
        });

        if (filtered.length === 0) {
          els.list.innerHTML = '';
          els.emptySearch.style.display = 'block';
          return;
        }

        els.emptySearch.style.display = 'none';

        els.list.innerHTML = filtered.map(function(u) {
          var isAdmin = u.role === 'admin';
          var isPremium = false;
          var daysLeft = 0;
          var expiryDate = '';

          if (u.premiumUntil) {
            var ms = u.premiumUntil.toMillis ? u.premiumUntil.toMillis() : u.premiumUntil.seconds * 1000;
            if (ms > Date.now()) {
              isPremium = true;
              daysLeft = Math.ceil((ms - Date.now()) / (1000 * 60 * 60 * 24));
              expiryDate = formatDate(ms);
            }
          }

          // Build Badges
          var badgeHtml = '';
          if (isAdmin) {
            badgeHtml = '<span class="badge badge-admin">ADMIN</span>';
          } else if (isPremium) {
            badgeHtml = '<span class="badge badge-premium">PREMIUM (' + daysLeft + 'd left)</span>';
          } else {
            badgeHtml = '<span class="badge badge-expired">EXPIRED</span>';
          }

          if (expiryDate) {
            badgeHtml += `<span class="badge badge-date">Ends: ${expiryDate}</span>`;
          }

          // Build Actions
          var actionsHtml = '';
          if (isAdmin) {
            actionsHtml = '<span class="muted" style="font-size:13px; font-style:italic; width:100%; text-align:center;">Admin access cannot be modified</span>';
          } else {
            actionsHtml = `
              <div class="input-group">
                <input type="number" id="input-${u.id}" placeholder="Days" min="1" required>
                <button onclick="applyDays('${u.id}')">APPLY</button>
              </div>
              ${isPremium ? `<button class="btn-revoke" onclick="revoke('${u.id}')" title="Remove Premium"><i class="fas fa-trash"></i></button>` : ''}
            `;
          }

          return `
            <div class="user-card">
              <div class="user-info">
                <div class="user-name">${u.fullName || 'Unknown User'}</div>
                <div class="user-contact">${u.phone || u.email || u.id}</div>
                <div class="badges">
                  ${badgeHtml}
                </div>
              </div>
              <div class="user-actions">
                ${actionsHtml}
              </div>
            </div>
          `;
        }).join('');
      }

      // --- Apply Custom Days ---
      window.applyDays = function(uid) {
        var input = document.getElementById('input-' + uid);
        var days = parseInt(input.value, 10);
        
        if (!days || days < 1) {
          showToast('Please enter a valid number of days.', 'error');
          input.focus();
          return;
        }

        var user = usersData.find(function(u) { return u.id === uid; });
        if (!user) return;

        // Calculate new expiry
        var now = new Date();
        var currentExpiry = (user.premiumUntil && user.premiumUntil.seconds) 
          ? new Date(user.premiumUntil.seconds * 1000) 
          : now;
          
        // If active, add to current. If expired, start from today.
        var baseDate = currentExpiry > now ? currentExpiry : now;
        baseDate.setDate(baseDate.getDate() + days);

        // Disable button to prevent double-click
        var btn = input.nextElementSibling;
        var originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = '...';

        db.collection('users').doc(uid).update({
          premiumUntil: firebase.firestore.Timestamp.fromDate(baseDate)
        }).then(function() {
          showToast(`Successfully added ${days} days to ${user.fullName || 'User'}.`, 'success');
          loadUsers(); // Refresh list
        }).catch(function(err) {
          showToast('Error: ' + err.message, 'error');
          btn.disabled = false;
          btn.textContent = originalText;
        });
      };

      // --- Revoke Premium ---
      window.revoke = function(uid) {
        var user = usersData.find(function(u) { return u.id === uid; });
        if (!user) return;

        if (!confirm(`Are you sure you want to revoke premium access for ${user.fullName}?`)) {
          return;
        }

        db.collection('users').doc(uid).update({
          premiumUntil: null
        }).then(function() {
          showToast('Premium access revoked.', 'info');
          loadUsers();
        }).catch(function(err) {
          showToast('Error: ' + err.message, 'error');
        });
      };

      // --- Event Listeners ---
      els.search.addEventListener('input', renderUsers);
      els.refreshBtn.addEventListener('click', loadUsers);

    })();
  </script>
</body>
</html>
